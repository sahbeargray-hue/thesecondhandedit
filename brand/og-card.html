<!doctype html>
<!--
  The social share card (1200x630): brand/og-card.html

  Tailwind is not available to a static file like this, so the card is written in
  plain CSS with the same values as the site's tokens. To regenerate
  public/og-card.png after a change to the mark or the headline:

    1. copy this file to /home/team/shared/site/public/_card-source.html
       (the dev server must be running: it serves /fonts/*.woff2 and /monogram.svg)
    2. agent-browser set viewport 1300 800 1
       agent-browser open http://localhost:3000/_card-source.html
       agent-browser wait 1200
       agent-browser screenshot "#card" /home/team/shared/site/public/og-card.png
    3. delete /home/team/shared/site/public/_card-source.html again

  The card must match SHARE_IMAGE_ALT in src/routes/__root.tsx: if you redraw
  the card, redraw that description too.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 400;
        src: url("/fonts/inter-400-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 500;
        src: url("/fonts/inter-500-normal.woff2") format("woff2");
      }
      @font-face {
        font-family: "Playfair Display";
        font-style: normal;
        font-weight: 400;
        src: url("/fonts/playfair-display-400-normal.woff2") format("woff2");
      }
      body {
        margin: 0;
        background: #fff;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #card {
        width: 1200px;
        height: 630px;
        background: #faf7f2;
        padding: 64px 80px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .label {
        font-size: 10.88px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        margin: 0;
      }
      .top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }
      .top .label {
        color: #4a5c4c;
        padding-top: 12px;
      }
      h1 {
        font-family: "Playfair Display", ui-serif, Georgia, serif;
        font-weight: 400;
        color: #1f1d1a;
        font-size: 80px;
        line-height: 1.04;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .lede {
        color: #635e59;
        font-size: 23.2px;
        line-height: 1.625;
        max-width: 46rem;
        margin: 28px 0 0;
      }
      .foot {
        border-top: 1px solid #d6c6a8;
        padding-top: 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .name {
        font-family: "Playfair Display", ui-serif, Georgia, serif;
        color: #1f1d1a;
        font-size: 24px;
        margin: 0;
      }
      .foot .label {
        color: #635e59;
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="top">
        <img src="/monogram.svg" alt="" style="height: 58px; width: auto" />
        <p class="label">Second-hand, first choice</p>
      </div>

      <div>
        <h1>Every piece here is the only one.</h1>
        <p class="lede">
          A small shop for second-hand clothing: one-of-a-kind pieces, photographed
          properly and described honestly. Listed once, sold once.
        </p>
      </div>

      <div class="foot">
        <p class="name">The Second Hand Edit</p>
        <p class="label">Second-hand, one of a kind</p>
      </div>
    </div>
  </body>
</html>
